[package]
name = "recordbox"
version = "0.9.0"
edition = "2021"
description = "Local DJ library, track analysis, set preparation and Pioneer-compatible USB export"

[[bin]]
name = "recordbox"
path = "src/main.rs"

[features]
directml = ["dep:ort", "dep:onnx-rs", "dep:bumpalo", "dep:windows"]
cuda12 = ["candle-core/cuda", "candle-nn/cuda"]
vulkan = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
eframe = "0.31.1"
winit = "0.30"
# AppKit remains enabled; this macOS app does not attach a GTK3 menu backend.
muda = { version = "0.21", default-features = false }
rusqlite = { version = "0.42", features = ["bundled-sqlcipher", "backup"] }
symphonia = { version = "0.5.5", features = ["all"] }
lofty = "0.22"
cpal = "0.15"
# Native MIDI controller ports.
midir = "0.10"
mp3lame-encoder = "0.3"
rustfft = "6.4"
rfd = "0.15"
quick-xml = "0.41"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rayon = "1.12"
parking_lot = "0.12"
anyhow = "1"
chrono = "0.4"
walkdir = "2.5"
dirs = "5"
unicode-normalization = "0.1"
rand = "0.8"
# Stem separation (open HTDemucs models, pure-Rust inference).
candle-core = "0.11.1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }
onnx-rs = { version = "0.1.3", optional = true }
bumpalo = { version = "3", optional = true }
candle-nn = "0.11.1"
sha2 = "0.10"
tempfile = "3"
ureq = "2"
# Clipboard text for Edit > Paste (already in the tree through egui).
arboard = { version = "3", default-features = false }
# Library backup archives (stored entries only: the database is small and audio/artwork
# are compressed already).
# Sampler packs also use DEFLATE. Library backups are restricted to stored entries.
zip = { version = "9.7.1", default-features = false, features = ["deflate-flate2"] }
egui_extras = { version = "0.31.1", default-features = false, features = ["svg"] }
md-5 = "0.10.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wgpu = { version = "24.0", default-features = false, features = ["wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_AI_MachineLearning_DirectML"], optional = true }
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", features = ["metal"] }
candle-nn = { version = "0.11.1", features = ["metal"] }
# The stem model's own Metal kernels (src/stems/metal_fast.rs) are built with the same Metal
# wrappers Candle uses; both crates are already in the tree through candle-core.
candle-metal-kernels = "0.11.1"
objc2-metal = "0.3"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
